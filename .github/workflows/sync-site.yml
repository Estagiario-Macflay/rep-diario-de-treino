name: Importar arquivos do REP
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sync-site.yml
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Baixar os arquivos do projeto ja publicado
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p js assets
          base="https://rep-diario-de-treino.vercel.app"
          for path in index.html styles.css js/data.js js/app.js assets/icon.svg; do
            curl --fail --location --retry 4 --retry-delay 3 --silent --show-error               "$base/$path" -o "$path"
            test -s "$path"
          done
          grep -q 'Diário de treino' index.html
          grep -q 'window.REP_DATA' js/data.js || grep -q 'REP_DATA' js/data.js
          grep -q 'localStorage' js/app.js
          printf '' > .nojekyll
      - name: Salvar arquivos no repositório
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css js/data.js js/app.js assets/icon.svg .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Adicionar arquivos completos do REP"
            git push
          fi
